services:
  pubsub-emulator:
    image: dipjyotimetia/pubsub-emulator:latest
    container_name: pubsub-emulator-recruitment-workflow
    environment:
      - PUBSUB_PROJECT=google-pub-sub-recruitment-workflow
      - PUBSUB_TOPIC=resume-job-description-detail,user-detail-email,user-interview-activation,user-question-response,user-interview-evaluation
      - PUBSUB_SUBSCRIPTION=resume-job-description-detail-sub,user-detail-email-sub,user-interview-activation-sub,user-question-response-sub,user-interview-evaluation-sub
      - PUBSUB_PORT=8085
      - DASHBOARD_PORT=8084
    ports:
      - "8085:8085"  # Pub/Sub emulator
      - "8084:8084"  # Web dashboard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis-recruitment-workflow
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
