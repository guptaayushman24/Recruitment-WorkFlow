services:
  pubsub-emulator:
    image: dipjyotimetia/pubsub-emulator:latest
    container_name: pubsub-emulator-recruitment-workflow
    environment:
      - PUBSUB_PROJECT=google-pub-sub-recruitment-workflow
      - PUBSUB_TOPIC=resume-job-description-detail,user-detail-email
      - PUBSUB_SUBSCRIPTION=resume-job-description-detail-sub,user-detail-email-sub
      - PUBSUB_PORT=8085
      - DASHBOARD_PORT=8084
    ports:
      - "8085:8085"  # Pub/Sub emulator
      - "8084:8084"  # Web dashboard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
